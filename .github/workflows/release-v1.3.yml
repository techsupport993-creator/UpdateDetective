name: Publish Update Detective 1.3.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.3.yml'
permissions:
  contents: read
concurrency:
  group: release-v1.3
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a6403fd94fd342e9f285ba31923ba4ba3baee452
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and package both distributions
        shell: pwsh
        run: |
          dotnet publish UpdateDetective.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableTrimAnalyzer=false -p:DebugType=None -p:DebugSymbols=false --source https://api.nuget.org/v3/index.json -o standalone
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path assets -Force | Out-Null
          Copy-Item standalone/UpdateDetective.exe assets/UpdateDetective-v1.3.0-win-x64.exe -ErrorAction Stop
          dotnet publish UpdateDetective.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -p:PublishTrimmed=false -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE,README.md publish/
          Compress-Archive -Path publish/* -DestinationPath assets/UpdateDetective-v1.3.0-win-x64.zip
          Get-ChildItem assets -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content assets/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: UpdateDetective-v1.3.0
          path: assets/
          if-no-files-found: error
  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UpdateDetective-v1.3.0
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          if gh release view v1.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v1.3.0 *.exe *.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target a6403fd94fd342e9f285ba31923ba4ba3baee452 --title "Update Detective v1.3.0" --prerelease --notes "New: recursive installation-folder monitoring, added/modified/deleted files, optional five-minute scans, Simple/Advanced modes, optional GitHub update checks, tabbed dashboard and custom icon. Download the standalone Windows x64 EXE (no separate .NET runtime required) or the framework-dependent ZIP. Verify SHA-256 against SHA256SUMS.txt. GPL-3.0 source and license available at this tag. Unsigned preview; Windows runtime testing pending."
